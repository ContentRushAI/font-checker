<!DOCTYPE html>

    font-size:20px;

    margin-bottom:10px;

table{
    width:100%;
    border-collapse:collapse;
}

th{
    font-size:12px;
    padding:6px 2px;

td{

}

td:first-child{

    font-weight:600;
}

.view-btn{
    font-size:10px;
    padding:4px 8px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    background:#000;
