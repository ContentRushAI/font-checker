<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Cafe Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:15px;
}

.cafe-name{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:20px 0 30px;
}

.category-card{
    display:block;
    width:100%;
    background:white;
    text-decoration:none;
    color:black;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-size:18px;
    font-weight:600;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    transition:0.2s;
}

.category-card:hover{
    transform:translateY(-2px);
}
</style>
</head>

<body>

<div class="cafe-name">
    Content Cafe
</div>

<a href="pizza.html" class="category-card">
    🍕 Pizza
</a>

</body>
</html>
